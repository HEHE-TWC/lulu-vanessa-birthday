<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Vanessa birthday countdown — pixel edition" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>♡ Countdown · For Vanessa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&family=Nunito:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=insidehide2" />
</head>
<body class="page-inside">
  <nav class="site-nav" aria-label="主選單">
    <a class="nav-brand" href="index.html?v=insidehide2">
      <img src="assets/lulu-mascot.png?v=insidehide2" alt="" width="36" height="36" />
      <span>♡ For Vanessa</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html?v=insidehide2">← 返回首頁</a></li>
    </ul>
  </nav>

  <main class="inside-shell">
    <!-- Pixel countdown: target 2026-11-11 00:00 Asia/Hong_Kong -->
    <section class="pixel-cd-hero" id="pixel-cd-hero" aria-live="polite">
      <h2 class="pixel-title" id="pixel-title"><img class="pixel-title-img" src="assets/title-daoshuzhong.png?v=insidehide2" alt="倒數中" width="280" height="104" /></h2>
      <p class="pixel-kicker">離 VANESSA 生日 仲有</p>
      <div class="pixel-countdown" id="pixel-countdown">
        <div class="pixel-cd-unit"><div class="num" data-cd="days">–</div><div class="lbl">DAYS</div></div>
        <div class="pixel-cd-unit"><div class="num" data-cd="hours">–</div><div class="lbl">HRS</div></div>
        <div class="pixel-cd-unit"><div class="num" data-cd="mins">–</div><div class="lbl">MIN</div></div>
        <div class="pixel-cd-unit"><div class="num" data-cd="secs">–</div><div class="lbl">SEC</div></div>
      </div>
      <div class="pixel-birthday-msg" id="pixel-birthday-msg">Vanessa<br />Happy Birthday</div>
      <p class="pixel-cd-sub" id="pixel-cd-sub">2026.11.11 00:00 · UTC+8</p>
    </section>

    <p class="inside-back">
      <a class="cta-hint" href="index.html?v=insidehide2">← 返去睇 LuLu 飛</a>
    </p>
  </main>

  <script src="js/main.js?v=insidehide2"></script>
</body>
</html>
